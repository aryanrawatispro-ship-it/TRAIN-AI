version: '3.8'

services:
  # ============================================================
  # Database
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trainmyai-postgres
    environment:
      POSTGRES_USER: trainmyai
      POSTGRES_PASSWORD: trainmyai_dev
      POSTGRES_DB: trainmyai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainmyai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Cache & Queue
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: trainmyai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================
  # Object Storage
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: trainmyai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Create MinIO bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/train-my-ai || true;
      exit 0;
      "

  # ============================================================
  # MLflow (Experiment Tracking)
  # ============================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: trainmyai-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://trainmyai:trainmyai_dev@postgres:5432/trainmyai
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      mlflow server
      --backend-store-uri postgresql://trainmyai:trainmyai_dev@postgres:5432/trainmyai
      --default-artifact-root s3://train-my-ai/mlflow/
      --host 0.0.0.0
    depends_on:
      - postgres
      - minio

  # ============================================================
  # Secrets Management
  # ============================================================
  vault:
    image: hashicorp/vault:latest
    container_name: trainmyai-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    command: server -dev

  # ============================================================
  # API Server
  # ============================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trainmyai-api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: trainmyai
      POSTGRES_USER: trainmyai
      POSTGRES_PASSWORD: trainmyai_dev
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: train-my-ai
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      MLFLOW_TRACKING_URI: http://mlflow:5000
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: INFO
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - minio
      - vault
      - mlflow
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================
  # Worker (Job Orchestrator)
  # ============================================================
  worker:
    build:
      context: ./workers
      dockerfile: Dockerfiles/base.Dockerfile
    container_name: trainmyai-worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: trainmyai
      POSTGRES_USER: trainmyai
      POSTGRES_PASSWORD: trainmyai_dev
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: train-my-ai
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./workers:/app
    depends_on:
      - postgres
      - redis
      - minio
      - mlflow
    command: python -m celery -A app worker --loglevel=info

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trainmyai-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev

  # ============================================================
  # Monitoring - Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: trainmyai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # ============================================================
  # Monitoring - Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: trainmyai-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: trainmyai-network
